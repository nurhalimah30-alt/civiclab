<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP | CIVICLAB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #06244d;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 0 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 17px;
      opacity: 0.9;
    }

    .sop-list {
      display: grid;
      gap: 25px;
    }

    .sop-card {
      background: #173f70;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .sop-card h2 {
      font-size: 22px;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      color: #ffffff;
      transition: 0.2s;
    }

    .btn-view {
      background: #2878d4;
    }

    .btn-download {
      background: #35c933;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .container {
        width: 92%;
        padding-top: 30px;
      }

      .header h1 {
        font-size: 28px;
      }

      .sop-card h2 {
        font-size: 19px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="index.html" class="back">← Kembali ke Beranda</a>

    <div class="header">
      <h1>📄 SOP CIVICLAB</h1>
      <p>Standar Operasional Prosedur Laboratorium PKn</p>
    </div>

    <div class="sop-list">

      <div class="sop-card">
        <h2>1. SOP Layanan Penggunaan dan Peminjaman Laboratorium PKn</h2>

        <div class="buttons">
          <a
            href="SOP%20Pengajuan%20Penggunaan%20Laboratorium%20PKn%20CIVICLAB.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-view">
            👁 Lihat SOP
          </a>

          <a
            href="SOP%20Pengajuan%20Penggunaan%20Laboratorium%20PKn%20CIVICLAB.pdf"
            download
            class="btn btn-download">
            ⬇ Download SOP
          </a>
        </div>
      </div>


      <div class="sop-card">
        <h2>2. SOP Pengembalian Media/Alat Laboratorium PKn</h2>

        <div class="buttons">
          <a
            href="SOP_Pengembalian_Media_Alat_Laboratorium_PKn_CIVICLAB_A4.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-view">
            👁 Lihat SOP
          </a>

          <a
            href="SOP_Pengembalian_Media_Alat_Laboratorium_PKn_CIVICLAB_A4.pdf"
            download
            class="btn btn-download">
            ⬇ Download SOP
          </a>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
